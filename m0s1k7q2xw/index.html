<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>「これでいい」と言える食卓｜アーカイブ</title>
<style>
  :root { --bg:#FFF6EA; --ink:#3a2f26; --accent:#E8833A; --card:#ffffff; --line:#F0D9BF; }
  @media (prefers-color-scheme: dark) { :root { --bg:#2a221b; --ink:#f3e9dc; --card:#382d24; --line:#5a4838; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif; line-height:1.8; }
  main { max-width:640px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.25rem; color:var(--accent); margin:0 0 .6em; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  label { display:block; margin-bottom:8px; }
  input[type=password], input[type=text] { width:100%; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  button { margin-top:12px; font-size:16px; padding:12px 20px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  #msg { color:#c0392b; min-height:1.6em; margin-top:8px; }
  #content a { color:var(--accent); }
  #content .video { margin:16px 0; }
  #content iframe { width:100%; aspect-ratio:16/9; border:0; border-radius:8px; }
</style>
</head>
<body>
<main>
  <h1>「これでいい」と言える食卓｜アーカイブ</h1>
  <div class="card" id="gate">
    <form id="f">
      <label for="pw">メールでお伝えしたパスワードを入れてください</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <button type="submit">見る</button>
      <div id="msg" role="alert"></div>
    </form>
  </div>
  <div id="content" hidden></div>
</main>
<script>
const SALT='urQAXzAh0xsTzVFXaykQpg==', IV='Ll0bX6e3LEySs+F0', ITER=250000, DATA='gTtRytXiz8nLHv67hFb2K8R3KGt6muKkO6vgzwr6RSFZy4LbWScGjLElKqE4Rj/XFUUv48XSsVCgo6ln/h9btPD/rYeXI1VqAEj/A+3z3AvNjvG1f9tZyscwVlmKUjFudSSPtHbjzEkUqn7sdBiMMAKBhlxS+EZV+dU2VhOkTDFMGvb4l2Q7mfJPCKnDRmh2EkQ8dd9EXzfHK0XlMw/npaeXTAb7uHd4bCrzvgZNhF4jMxAsHacvnhUHkFWiGzMTBKMy+PR6UXaz5pJAqUf6l6QeA1h9doLOfVb2+wjGfTx4eAcekwjvKYRv+8kp6ILk6alqts1m52WzgBhbwGLpo+kN3qf6lru8JicLpQQc48CPfB3iyrRsPUWcCffOqH98S7dl1YScbjeHDbkYQLdCe9h6tAim0hwQUbhsjR70c1YeGPLtB1k1O+D3hLc3TCRbtE/5eltduziJimZ8oc7+So2GRjaT7ef9/qXtjP7v284PQKMiZJTxKvD/Cm8/4wC81H7C7vhly37452B9nF5TMLrk9AFt38flok8OSKuHcnLfZ7HsczFWrGFrvgYCJppVsaSWxJrtzNjc14S26tWVqrLLHXXcg+xNBz8vasiGbD5pMyqo4sDLTOVK29BxphkZtSrv8kikiu7y/dOjLRLwb7hZ4byJeeo5hXQ2mAUDBMZ1c64G2VFbPtLa91x0dC2BL0RP6Mvs4HFQENN1B+RXZYsEanzO5VXoJGPu1vcG8scKO6i8SMXD0OfpA6rpeUKZnQD+ivy+Azn4eDJcReXeSmtNBax/iZpzUKZ1jVv/Pr2boRvHZaPsHHTZsHBowLn6RkcF9NnM+ZiFEhpXjk8PcqmBjrwiuTpnBWAIONzGDg3IDSbOBF4xeVwjQeGsXBTpKvpoadDkS4B7sJ/dlv01v0dRy0USGd+qI765u0W+U3LbjdO6T9jVzJGhLvhyeKgzbANWvf1BfdR7Ed3rrOw6WHcyWxmWkga+mhlOvNGQYvurfkB1R+uAZK/gOoMsj0ZogVVSD/TJZvhIH5khPOakqxNa7Eguma+W34pMLd4A2diL3LTv1Y30hUSQj5lMVujJdcp+IRUZVt5rttWrr58UdPJWdGnvOZuCMyWFa8p0AevlPKPmPjFKwUI=';
const u8 = (b)=>Uint8Array.from(atob(b), ch=>ch.charCodeAt(0));
async function open(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(SALT), iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(IV)}, key, u8(DATA));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const msg = document.getElementById('msg'); msg.textContent='';
  try {
    const html = await open(document.getElementById('pw').value);
    const c = document.getElementById('content'); c.innerHTML = html; c.hidden = false;
    document.getElementById('gate').hidden = true;
  } catch (err) { msg.textContent = 'パスワードが違うようです。もう一度お試しください。'; }
});
</script>
</body>
</html>
