<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<title>「これでいい」と言える食卓｜動画視聴ページ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f9f7ef; --brown:#553727; --sub:#85634b; --blue:#0085c9; --lblue:#7abbe2; --pale:#eaf4fb;
    --orange:#f26b3b; --line:#8a6850;
  }
  * { box-sizing:border-box; }
  html { color-scheme:light; }
  body { margin:0; background:var(--bg); color:var(--brown); font-family:'Noto Sans JP','Hiragino Sans',sans-serif; line-height:1.9; -webkit-text-size-adjust:100%; }
  .bar { position:fixed; left:0; top:0; bottom:0; width:10px; background:var(--blue); z-index:3; }
  .mark { position:fixed; right:-8vw; bottom:-4vw; width:min(62vw,560px); aspect-ratio:830/580; background:url(assets/mark.png) right bottom/contain no-repeat; opacity:.9; z-index:0; pointer-events:none; }
  main { position:relative; z-index:1; max-width:680px; margin:0 auto; padding:44px 20px 56px 30px; }
  .eyebrow { margin:0 0 10px; font-size:.95rem; color:var(--sub); letter-spacing:.08em; }
  h1 { margin:0; font-family:'Zen Old Mincho','Noto Serif JP',serif; font-weight:700; font-size:clamp(1.65rem,6.6vw,2.4rem); line-height:1.5; color:var(--brown); letter-spacing:.04em; }
  .sub { margin:14px 0 0; display:inline-flex; align-items:center; gap:10px; background:var(--blue); color:#fff; font-weight:700; font-size:1.05rem; padding:7px 20px; border-radius:999px; letter-spacing:.06em; }
  .sub .play { font-size:.8rem; }
  .lead { margin:0 0 18px; font-size:1rem; }
  .rule { width:min(260px,56%); height:3px; background:var(--line); margin:22px 0 28px; border-radius:2px; }
  .card { background:#fff; border:3px solid var(--lblue); border-radius:24px; padding:22px 20px; }
  label { display:block; margin-bottom:10px; font-weight:500; }
  input[type=password] { width:100%; font-size:16px; padding:14px 16px; border:2px solid var(--lblue); border-radius:14px; background:var(--bg); color:var(--brown); font-family:inherit; }
  input[type=password]:focus { outline:3px solid #cfe7f6; border-color:var(--blue); }
  button { margin-top:14px; width:100%; font-size:17px; font-weight:700; padding:14px 20px; border:0; border-radius:999px; background:var(--orange); color:#fff; cursor:pointer; font-family:inherit; letter-spacing:.06em; }
  button:active { transform:translateY(1px); }
  #msg { color:#b3402a; min-height:1.7em; margin-top:10px; font-size:.95rem; }

  /* 開いたあと */
  .session { background:#fff; border:3px solid var(--lblue); border-radius:24px; padding:20px 16px 18px; }
  .s-head { display:flex; gap:14px; align-items:center; margin-bottom:16px; }
  .num { flex:none; width:46px; height:46px; border-radius:50%; background:var(--orange); color:#fff; font-weight:700; font-size:1.5rem; display:flex; align-items:center; justify-content:center; line-height:1; }
  .s-label { margin:0; font-size:.88rem; color:var(--sub); line-height:1.5; }
  .s-title { margin:2px 0 0; font-family:'Zen Old Mincho',serif; font-weight:700; font-size:clamp(1.15rem,4.6vw,1.45rem); line-height:1.5; color:var(--brown); }
  .video { border-radius:16px; overflow:hidden; background:#000; border:3px solid var(--lblue); }
  .video iframe { display:block; width:100%; aspect-ratio:16/9; border:0; }
  .meta { margin:12px 2px 0; font-size:.88rem; color:var(--sub); }
  .note { margin:22px 0; background:var(--pale); border:3px solid var(--lblue); border-radius:20px; padding:16px 18px; font-size:.95rem; line-height:1.85; }
  .sheet { display:block; text-align:center; text-decoration:none; background:var(--orange); color:#fff; font-weight:700; font-size:1.02rem; padding:16px 18px; border-radius:999px; letter-spacing:.04em; line-height:1.5; }
  .sheet small { display:block; font-weight:500; font-size:.8rem; opacity:.95; letter-spacing:.02em; }
  .after, .note, .lead, .s-title, .meta { text-wrap:balance; }
  .after-box { margin-top:18px; padding-top:18px; border-top:2px dashed var(--lblue); }
  .after { margin:0 0 12px; text-align:center; font-size:.95rem; }

  footer { margin-top:46px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  footer img { width:150px; height:auto; display:block; }
  footer p { margin:0; font-size:.7rem; color:var(--sub); line-height:1.6; }
  footer p.fine { flex-basis:100%; font-size:.78rem; margin-bottom:2px; }
  .deadline { margin:0 0 18px; display:flex; align-items:center; gap:10px; font-weight:700; }
  .deadline span { background:var(--pale); border:2px solid var(--lblue); border-radius:999px; padding:1px 12px; font-size:.82rem; font-weight:500; }
  .band { margin:-6px 0 18px; font-size:.9rem; color:var(--sub); }
  .toc { margin-top:18px; background:var(--pale); border:2px solid var(--lblue); border-radius:18px; padding:14px 14px 10px; }
  .toc-h { margin:0 0 8px; font-weight:700; font-size:1rem; }
  .toc-h span { margin-left:10px; font-weight:400; font-size:.8rem; color:var(--sub); }
  .toc ol { list-style:none; margin:0; padding:0; }
  .toc li { border-top:1px solid #cfe7f6; }
  .toc li:first-child { border-top:0; }
  .toc button { all:unset; box-sizing:border-box; display:flex; gap:12px; width:100%; padding:9px 4px; cursor:pointer; font-size:.95rem; line-height:1.6; color:var(--brown); font-family:inherit; }
  .toc button b { flex:none; min-width:3.6em; color:var(--blue); font-weight:700; font-variant-numeric:tabular-nums; }
  .toc button:hover, .toc button:focus-visible { background:#dcedf8; border-radius:8px; }
  .values { margin-top:26px; background:#fff; border:3px solid var(--lblue); border-radius:24px; padding:20px 14px 18px; }
  .v-title { margin:0 0 14px; font-family:'Zen Old Mincho',serif; font-weight:700; font-size:clamp(1.15rem,4.6vw,1.4rem); color:var(--blue); text-align:center; }
  .v-grid { display:grid; gap:12px; }
  .v-card { border:2px solid var(--lblue); border-radius:18px; padding:14px 12px; text-align:center; background:#fff; }
  .v-card .num { margin:0 auto 8px; width:38px; height:38px; font-size:1.2rem; }
  .v-name { margin:0; font-family:'Zen Old Mincho',serif; font-weight:700; font-size:1.15rem; line-height:1.5; }
  .v-text { margin:6px 0 0; font-size:.92rem; color:var(--sub); line-height:1.7; }
  .v-foot { margin:14px 0 0; text-align:center; color:var(--orange); font-weight:500; font-size:.95rem; line-height:1.8; text-wrap:balance; }
  @media (min-width:700px) { .v-grid { grid-template-columns:repeat(3,1fr); } .values { padding:26px 24px 22px; border-width:4px; border-radius:30px; } }
  @media (min-width:700px) { main { padding:64px 24px 72px; } .card, .session { padding:28px 28px 24px; border-width:4px; border-radius:30px; } .video { border-width:4px; } .bar { width:16px; } }
</style>
</head>
<body>
<div class="bar"></div>
<div class="mark" aria-hidden="true"></div>
<main>
  <p class="eyebrow">ドイツIOBオーガニックスクール｜90日間モニター</p>
  <h1>「これでいい」と言える食卓</h1>
  <p class="sub">授業の動画視聴ページ</p>
  <div class="rule"></div>
  <p class="lead" id="lead">パスワードを入力して、録画をご覧ください。</p>
  <div class="card" id="gate">
    <form id="f">
      <label for="pw">パスワード</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <button type="submit">録画ページを開く</button>
      <div id="msg" role="alert"></div>
    </form>
  </div>
  <div id="content" hidden></div>
  <footer>
    <p class="fine">このページは、90日モニターの方のための動画視聴ページです。転送などはお控えください。</p>
    <img src="assets/logo.png" alt="Institut für Organic Business">
    <p>Copyright ©2026 Institut für Organic Business GmbH.<br>All Rights Reserved.</p>
  </footer>
</main>

const u8 = (b)=>Uint8Array.from(atob(b), ch=>ch.charCodeAt(0));
async function open(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(SALT), iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(IV)}, key, u8(DATA));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const msg = document.getElementById('msg'); msg.textContent='';
  try {
    const html = await open(document.getElementById('pw').value);
    const c = document.getElementById('content'); c.innerHTML = html; c.hidden = false;
    document.getElementById('gate').hidden = true; document.getElementById('lead').hidden = true;
  } catch (err) { msg.textContent = 'パスワードが違います。もう一度入力してください。'; }
});
// 目次：押すと、その場面から再生
document.getElementById('content').addEventListener('click', (e)=>{
  const b = e.target.closest('[data-t]'); if(!b) return;
  const sec = b.closest('.session'); const fr = sec && sec.querySelector('iframe'); if(!fr) return;
  const t = Number(b.dataset.t);
  fr.scrollIntoView({behavior:'smooth', block:'center'});
  const fallback = ()=>{ const base = fr.src.split('#')[0]; fr.src = base + (base.includes('autoplay')?'':'&autoplay=1') + '#t=' + t + 's'; };
  if (window.Vimeo && Vimeo.Player) {
    try { fr._p = fr._p || new Vimeo.Player(fr); fr._p.setCurrentTime(t).then(()=>fr._p.play()).catch(fallback); } catch(_) { fallback(); }
  } else { fallback(); }
});
